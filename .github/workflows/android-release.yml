name: Again Android Release Build

on:
  # Android 暂不自动发布 (secrets 未配 / 真机验证未全部完成),
  # 需要时在 Actions 页面手动触发 (workflow_dispatch)。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APP_NAME: "${{ github.event.repository.name }}"
      VERSION: "${{ github.ref_name }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: stable
          cache: true

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=again
          storeFile=upload-keystore.jks
          EOF

      - name: Build APK Release
        run: flutter build apk --release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "${{ env.APP_NAME }} ${{ env.VERSION }}"
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
