name: Again Android Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APP_NAME: "${{ github.event.repository.name }}"
      VERSION: "${{ github.ref_name }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 校验 tag 归属需要完整历史 (merge-base), 不能浅克隆
          fetch-depth: 0

      # 校验发布 tag 必须在 main 分支上 (防止误从平台分支发布)
      - name: 校验 tag 归属 main
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${{ github.ref_name }}" origin/main; then
            echo "Tag ${{ github.ref_name }} 不在 main 分支上, 拒绝发布。"
            exit 1
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: stable
          cache: true

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=again
          storeFile=upload-keystore.jks
          EOF

      - name: Build APK Release
        run: flutter build apk --release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "${{ env.APP_NAME }} ${{ env.VERSION }}"
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
