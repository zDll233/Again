name: AsmrDownloader Windows Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      APP_NAME: "${{ github.event.repository.name }}"
      VERSION: "${{ github.ref_name }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 校验 tag 归属需要完整历史 (merge-base), 不能浅克隆
          fetch-depth: 0

      # 校验发布 tag 必须在 main 分支上 (防止误从平台分支发布导致 UI 串台)
      # 注意: 必须判断 $LASTEXITCODE, 不能用 if (-not (git ...)) —
      # PowerShell 会按输出是否为空判断, git merge-base 成功输出为空会误判失败
      - name: 校验 tag 归属 main
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${{ github.ref_name }}" origin/main
          if ($LASTEXITCODE -ne 0) {
            echo "Tag ${{ github.ref_name }} 不在 main 分支上, 拒绝发布。"
            exit 1
          }

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: stable
          cache: true

    #   - name: Install dependencies
    #     shell: pwsh
    #     run: |
    #       flutter config --enable-windows-desktop
    #       flutter pub get

      - name: Set pubspec version from tag
        shell: pwsh
        run: |
          # exe 右键属性里的产品版本取自 pubspec.yaml 的 version (经 Runner.rc 的
          # FLUTTER_VERSION 注入), 与应用内 kAppVersion (--dart-define) 无关,
          # 构建前同步到 tag, 保证 exe 属性版本跟随发布版本
          $v = "${{ env.VERSION }}" -replace '^v', ''
          (Get-Content pubspec.yaml) | ForEach-Object {
            if ($_ -match '^version:') { "version: $v" } else { $_ }
          } | Set-Content pubspec.yaml -Encoding utf8
          Get-Content pubspec.yaml | Select-Object -First 6

      - name: Build Windows Release
        shell: pwsh
        run: |
          flutter build windows --release --dart-define=APP_VERSION="${{ env.VERSION }}"

      - name: Compress Release Folder
        shell: pwsh
        run: |
          if (!(Test-Path -Path "dist")) {
            New-Item -ItemType Directory -Path "dist"
          }

          $ZipFileName = "${{ env.APP_NAME }}-${{ env.VERSION }}-Windows-x64.zip"

          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath "dist/$ZipFileName"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "${{ env.APP_NAME }} ${{ env.VERSION }}"
          files: "dist/*.zip"
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}