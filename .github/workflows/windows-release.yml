name: AsmrDownloader Windows Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      APP_NAME: "${{ github.event.repository.name }}"
      VERSION: "${{ github.ref_name }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 校验发布 tag 必须在 main 分支上 (防止误从平台分支发布导致 UI 串台)
      - name: 校验 tag 归属 main
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          git fetch origin main --depth=1
          if (-not (git merge-base --is-ancestor $tag origin/main)) {
            Write-Error "Tag $tag 不在 main 分支上, 拒绝发布。Windows 版本必须从 main 打 tag。"
            exit 1
          }

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: stable
          cache: true

    #   - name: Install dependencies
    #     shell: pwsh
    #     run: |
    #       flutter config --enable-windows-desktop
    #       flutter pub get

      - name: Build Windows Release
        shell: pwsh
        run: |
          flutter build windows --release --dart-define=APP_VERSION="${{ env.VERSION }}"

      - name: Compress Release Folder
        shell: pwsh
        run: |
          if (!(Test-Path -Path "dist")) {
            New-Item -ItemType Directory -Path "dist"
          }

          $ZipFileName = "${{ env.APP_NAME }}-${{ env.VERSION }}-Windows.zip"

          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath "dist/$ZipFileName"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "${{ env.APP_NAME }} ${{ env.VERSION }}"
          files: "dist/*.zip"
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}